name: Release

on:
  workflow_dispatch:
    inputs:
      version-increment:
        description: 'The type of version increment to apply.'
        type: choice
        options:
          - patch
          - minor
          - major
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Update Version
        run: npm version ${{ github.event.inputs.version-increment }}

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Push Changes
        run: |
          git push
          git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
