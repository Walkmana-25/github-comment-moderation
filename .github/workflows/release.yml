name: Release

on:
  workflow_dispatch:
    inputs:
      version-increment:
        description: 'The type of version increment to apply.'
        type: choice
        options:
          - patch
          - minor
          - major
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Update Version
        id: version
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.version-increment }})
          echo "tag=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
      
      - name: Commit Changes
        run: |
          git add package.json package-lock.json dist/index.js
          git commit -m "chore(release build): v${{ steps.version.outputs.version }} by Github Actions"

      - name: Push Changes
        run: |
          git push
          git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.tag }}
          files: dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
